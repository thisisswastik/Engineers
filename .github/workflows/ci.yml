name: CI — Syntax & Import Check

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    name: Python Syntax & Import Check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UV
        run: pip install uv

      # uv sync reads pyproject.toml + uv.lock and installs exact pinned versions.
      # This is the correct command for uv-managed projects (not uv pip install).
      - name: Install dependencies
        run: uv sync

      # Compile every .py file outside .venv, __pycache__, and test_project/
      - name: Check syntax of all Python files
        run: |
          echo "Checking syntax..."
          find . -name "*.py" \
            -not -path "./.venv/*" \
            -not -path "./__pycache__/*" \
            -not -path "./test_project/*" \
            | xargs uv run python -m py_compile
          echo "All Python files passed syntax check!"

      # Write the check to a script file to avoid YAML-indentation / shell-quoting issues.
      # Agents must be importable with NO GEMINI_API_KEY set (LLMs are lazy-loaded inside nodes).
      - name: Verify all agent imports succeed
        run: |
          cat > /tmp/check_imports.py << 'EOF'
import agents.ceo
import agents.architect
import agents.product_manager
import agents.backend
import agents.frontend
import agents.database
import agents.qa
import agents.security
import agents.reviewer
import agents.coder
import agents.documentation
import agents.devops
print("All 12 agent imports: OK")
EOF
          uv run python /tmp/check_imports.py

      - name: Verify API core imports succeed
        run: |
          cat > /tmp/check_api.py << 'EOF'
from fastapi import FastAPI
from langgraph.checkpoint.sqlite.aio import AsyncSqliteSaver
from contextlib import asynccontextmanager
from pydantic import BaseModel
print("API core imports: OK")
EOF
          uv run python /tmp/check_api.py
