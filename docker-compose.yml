version: '3.8'

services:
  engineers-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engineers-platform
    ports:
      - "8000:8000"   # FastAPI API & WebSockets
      - "6006:6006"   # Arize Phoenix Observability Dashboard
      - "5173:5173"   # Generated Frontend App
    env_file:
      - .env
    volumes:
      - ./test_project:/app/test_project
      - ./logs:/app/logs
    restart: unless-stopped
